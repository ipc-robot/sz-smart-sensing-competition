<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组委会作品管理后台 · 深圳市智能感知与自主系统设计竞赛</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent: #0d9488;
      --danger: #dc2626;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .topbar {
      background: #070d1e;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .topbar h1 { margin: 0; font-size: 1.08rem; font-weight: 700; }
    .topbar-actions { display: flex; gap: 0.6rem; align-items: center; }
    .container { max-width: 1280px; margin: 1.5rem auto; padding: 0 1.25rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.35rem;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .login-wrap { max-width: 420px; margin: 4.5rem auto; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.52rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-danger { background: #fff; border-color: #fecaca; color: var(--danger); }
    .btn-danger:hover { background: #fef2f2; }
    .btn-sm { padding: 0.34rem 0.65rem; font-size: 0.78rem; }
    .input {
      width: 100%;
      padding: 0.62rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 0.9rem;
      margin-bottom: 1.25rem;
    }
    .stat-box { padding: 1rem 1.15rem; }
    .stat-num { font-size: 1.65rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.82rem; color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .pill {
      padding: 0.38rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .search-input { width: min(280px, 100%); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { padding: 0.78rem 0.7rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-size: 0.78rem; color: var(--muted); background: #f8fafc; white-space: nowrap; }
    .tag {
      display: inline-block;
      padding: 0.16rem 0.55rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      white-space: nowrap;
    }
    .muted { color: var(--muted); font-size: 0.78rem; }
    .error-msg { color: var(--danger); font-size: 0.86rem; margin-top: 0.6rem; }
    .hidden { display: none !important; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 50;
    }
    .modal.open { display: flex; }
    .modal-box { max-width: 640px; width: 100%; max-height: 88vh; overflow-y: auto; }
    .detail-grid { display: grid; grid-template-columns: 110px 1fr; gap: 0.45rem 0.75rem; font-size: 0.88rem; }
    .detail-label { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>深圳市智能感知与自主系统设计竞赛 · 组委会作品管理后台</h1>
    <div class="topbar-actions">
      <a href="./" class="btn btn-sm" style="background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.22);">返回赛事首页</a>
      <button type="button" id="logout-btn" class="btn btn-sm hidden">退出登录</button>
    </div>
  </header>

  <main class="container">
    <!-- Login View -->
    <section id="login-view" class="card login-wrap">
      <h2 style="margin-top:0;font-size:1.18rem;">组委会身份验证</h2>
      <p class="muted" style="margin-bottom:1rem;">请输入管理密码（保存在服务器 <code>server/.env</code> 中）。</p>
      <form id="login-form">
        <input type="password" id="password-input" class="input" placeholder="请输入管理密码" required autocomplete="current-password">
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:0.85rem;">登录后台</button>
        <div id="login-error" class="error-msg hidden"></div>
      </form>
    </section>

    <!-- Dashboard View -->
    <section id="dashboard-view" class="hidden">
      <div class="stats">
        <div class="card stat-box">
          <div class="stat-num" id="stat-total">0</div>
          <div class="stat-label">已提交队伍总数</div>
        </div>
        <div class="card stat-box">
          <div class="stat-num" id="stat-t1">0</div>
          <div class="stat-label">柔性电子</div>
        </div>
        <div class="card stat-box">
          <div class="stat-num" id="stat-t2">0</div>
          <div class="stat-label">具身智能机器人</div>
        </div>
        <div class="card stat-box">
          <div class="stat-num" id="stat-t3">0</div>
          <div class="stat-label">开源鸿蒙 / RISC-V</div>
        </div>
        <div class="card stat-box">
          <div class="stat-num" id="stat-video">0</div>
          <div class="stat-label">含视频 / 视频链接</div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="filter-pills" id="track-filters">
            <button type="button" class="pill active" data-track="ALL">全部赛题</button>
            <button type="button" class="pill" data-track="柔性电子">柔性电子</button>
            <button type="button" class="pill" data-track="具身智能机器人">具身智能机器人</button>
            <button type="button" class="pill" data-track="开源鸿蒙/RISC-V">开源鸿蒙/RISC-V</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
            <input type="search" id="search-input" class="input search-input" placeholder="搜索队伍、作品、学校、编号…">
            <button type="button" id="refresh-btn" class="btn">刷新</button>
            <a id="export-btn" href="#" class="btn btn-accent">导出 CSV</a>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>编号 / 提交时间</th>
                <th>赛题</th>
                <th>队伍与作品</th>
                <th>队长与学校</th>
                <th>技术文档</th>
                <th>作品视频</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="7" class="muted" style="text-align:center;padding:2rem;">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal" id="detail-modal">
    <div class="card modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 style="margin:0;">作品详情</h3>
        <button type="button" id="detail-close" class="btn btn-sm">关闭</button>
      </div>
      <div id="detail-content" class="detail-grid"></div>
    </div>
  </div>

  <script>
    (() => {
      const BASE_PREFIX = window.location.pathname.replace(/\/admin\/?$/, '');
      const API_BASE = `${BASE_PREFIX}/api`;

      const loginView = document.getElementById('login-view');
      const dashView = document.getElementById('dashboard-view');
      const logoutBtn = document.getElementById('logout-btn');
      const loginForm = document.getElementById('login-form');
      const loginError = document.getElementById('login-error');
      const passwordInput = document.getElementById('password-input');
      const tableBody = document.getElementById('table-body');
      const searchInput = document.getElementById('search-input');
      const exportBtn = document.getElementById('export-btn');
      const detailModal = document.getElementById('detail-modal');
      const detailContent = document.getElementById('detail-content');

      exportBtn.href = `${API_BASE}/admin/export.csv`;

      let allRows = [];
      let activeTrack = 'ALL';

      const formatSize = (bytes) => {
        if (!bytes) return '-';
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      };

      const formatTime = (iso) => {
        if (!iso) return '-';
        return new Date(iso).toLocaleString('zh-CN', { hour12: false });
      };

      const escapeHtml = (str) =>
        String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

      const showAuth = (authed) => {
        loginView.classList.toggle('hidden', authed);
        dashView.classList.toggle('hidden', !authed);
        logoutBtn.classList.toggle('hidden', !authed);
      };

      const renderRows = () => {
        const q = searchInput.value.trim().toLowerCase();
        const filtered = allRows.filter((r) => {
          if (activeTrack !== 'ALL' && r.track !== activeTrack) return false;
          if (!q) return true;
          return [r.id, r.team_name, r.project_title, r.leader_name, r.school, r.email, r.phone]
            .some((v) => String(v || '').toLowerCase().includes(q));
        });

        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="7" class="muted" style="text-align:center;padding:2rem;">暂无符合条件的报名记录</td></tr>';
          return;
        }

        tableBody.innerHTML = filtered
          .map((r) => {
            const docCell = r.doc_original_name
              ? `<a class="btn btn-sm" href="${API_BASE}/admin/submissions/${encodeURIComponent(r.id)}/file/doc">下载文档</a><div class="muted" style="margin-top:4px;">${escapeHtml(r.doc_original_name)} (${formatSize(r.doc_size)})</div>`
              : '<span class="muted">无</span>';

            let videoCell = '<span class="muted">未提交</span>';
            if (r.video_original_name && r.video_url) {
              videoCell = `<a class="btn btn-sm" href="${API_BASE}/admin/submissions/${encodeURIComponent(r.id)}/file/video">下载视频</a> <a class="btn btn-sm" href="${escapeHtml(r.video_url)}" target="_blank" rel="noopener noreferrer">外链</a><div class="muted" style="margin-top:4px;">${escapeHtml(r.video_original_name)} (${formatSize(r.video_size)})</div>`;
            } else if (r.video_original_name) {
              videoCell = `<a class="btn btn-sm" href="${API_BASE}/admin/submissions/${encodeURIComponent(r.id)}/file/video">下载视频</a><div class="muted" style="margin-top:4px;">${escapeHtml(r.video_original_name)} (${formatSize(r.video_size)})</div>`;
            } else if (r.video_url) {
              videoCell = `<a class="btn btn-sm" href="${escapeHtml(r.video_url)}" target="_blank" rel="noopener noreferrer">打开视频链接</a>${r.video_note ? `<div class="muted" style="margin-top:4px;">${escapeHtml(r.video_note)}</div>` : ''}`;
            }

            return `
              <tr>
                <td><strong>${escapeHtml(r.id)}</strong><div class="muted">${formatTime(r.submitted_at)}</div></td>
                <td><span class="tag">${escapeHtml(r.track)}</span></td>
                <td><strong>${escapeHtml(r.team_name)}</strong><div class="muted">${escapeHtml(r.project_title)}</div></td>
                <td>${escapeHtml(r.leader_name)} · ${escapeHtml(r.school)}<div class="muted">${escapeHtml(r.phone)} / ${escapeHtml(r.email)}</div></td>
                <td>${docCell}</td>
                <td>${videoCell}</td>
                <td style="white-space:nowrap;">
                  <button type="button" class="btn btn-sm" data-detail="${escapeHtml(r.id)}">详情</button>
                  <button type="button" class="btn btn-sm btn-danger" data-delete="${escapeHtml(r.id)}">删除</button>
                </td>
              </tr>
            `;
          })
          .join('');
      };

      const loadSubmissions = async () => {
        const resp = await fetch(`${API_BASE}/admin/submissions`, { credentials: 'include' });
        if (resp.status === 401) {
          showAuth(false);
          return;
        }
        const data = await resp.json();
        showAuth(true);
        allRows = data.submissions || [];
        document.getElementById('stat-total').textContent = data.stats.total;
        document.getElementById('stat-t1').textContent = data.stats.tracks['柔性电子'] || 0;
        document.getElementById('stat-t2').textContent = data.stats.tracks['具身智能机器人'] || 0;
        document.getElementById('stat-t3').textContent = data.stats.tracks['开源鸿蒙/RISC-V'] || 0;
        document.getElementById('stat-video').textContent = data.stats.withVideo || 0;
        renderRows();
      };

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        loginError.classList.add('hidden');
        const resp = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ password: passwordInput.value }),
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          loginError.textContent = data.error || '登录失败';
          loginError.classList.remove('hidden');
          return;
        }
        passwordInput.value = '';
        await loadSubmissions();
      });

      logoutBtn.addEventListener('click', async () => {
        await fetch(`${API_BASE}/admin/logout`, { method: 'POST', credentials: 'include' });
        showAuth(false);
      });

      document.getElementById('refresh-btn').addEventListener('click', loadSubmissions);
      searchInput.addEventListener('input', renderRows);

      document.getElementById('track-filters').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-track]');
        if (!btn) return;
        activeTrack = btn.getAttribute('data-track');
        document.querySelectorAll('#track-filters .pill').forEach((p) => {
          p.classList.toggle('active', p === btn);
        });
        renderRows();
      });

      tableBody.addEventListener('click', async (e) => {
        const detailBtn = e.target.closest('[data-detail]');
        if (detailBtn) {
          const id = detailBtn.getAttribute('data-detail');
          const row = allRows.find((r) => r.id === id);
          if (!row) return;
          const items = [
            ['报名编号', row.id],
            ['参赛赛题', row.track],
            ['队伍名称', row.team_name],
            ['作品名称', row.project_title],
            ['队长姓名', row.leader_name],
            ['学校/单位', row.school],
            ['联系电话', row.phone],
            ['联系邮箱', row.email],
            ['其他队员', row.members || '无'],
            ['指导老师', row.advisor || '无'],
            ['提交时间', formatTime(row.submitted_at)],
            ['作品简介', row.summary],
            ['技术文档', row.doc_original_name ? `${row.doc_original_name} (${formatSize(row.doc_size)})` : '无'],
            ['上传视频', row.video_original_name ? `${row.video_original_name} (${formatSize(row.video_size)})` : '无'],
            ['视频外链', row.video_url || '无'],
            ['视频备注', row.video_note || '无'],
          ];
          detailContent.innerHTML = items
            .map(([k, v]) => `<div class="detail-label">${escapeHtml(k)}</div><div>${escapeHtml(v)}</div>`)
            .join('');
          detailModal.classList.add('open');
          return;
        }

        const delBtn = e.target.closest('[data-delete]');
        if (delBtn) {
          const id = delBtn.getAttribute('data-delete');
          if (!window.confirm(`确认删除报名记录 ${id} 及其已上传文件吗？此操作不可恢复。`)) return;
          const resp = await fetch(`${API_BASE}/admin/submissions/${encodeURIComponent(id)}`, {
            method: 'DELETE',
            credentials: 'include',
          });
          if (resp.ok) {
            await loadSubmissions();
          }
        }
      });

      document.getElementById('detail-close').addEventListener('click', () => {
        detailModal.classList.remove('open');
      });
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) detailModal.classList.remove('open');
      });

      loadSubmissions();
    })();
  </script>
</body>
</html>
